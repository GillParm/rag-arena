[project]
name = "rag-arena"
version = "0.1.0"
description = "A benchmark and playground that runs several RAG strategies over the same documents."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0",
    "bm25s>=0.3.16",
    "fastapi>=0.162.4",
    "fastembed>=0.9.1",
    "google-genai>=3.1.0",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pystemmer>=3.1.0",
    "rich>=15.0.0",
    "typer>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
rag-arena = "rag_arena.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_arena"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["rag_arena", "tests"]
exclude = ["tests/fixtures/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bm25s.*", "Stemmer.*", "fastembed.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "db: needs a Postgres with pgvector (RAG_ARENA_DATABASE_URL)",
    "live: calls real model APIs and costs money; run with -m live",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
